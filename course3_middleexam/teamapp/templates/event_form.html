{% extends "layout.html" %}
{% block content %}
{# 追加と編集で共通のフォーム。編集のときは ev に既存の値が入ってくる #}

<h1 class="h5 mb-3">{{ title }}</h1>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">種別</label>
        <select class="form-select" name="etype">
          {% for key, label in ETYPES.items() %}
          <option value="{{ key }}" {% if ev and ev.etype == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">タイトル <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="title" required
               placeholder="例: 通常練習 / 練習試合 vs △△FC" value="{{ ev.title if ev else '' }}">
      </div>
      <div class="row">
        <div class="col-12 col-sm-4 mb-3">
          <label class="form-label">日付 <span class="text-danger">*</span></label>
          <input type="date" class="form-control" name="event_date" required value="{{ ev.event_date if ev else '' }}">
        </div>
        <div class="col-6 col-sm-4 mb-3">
          <label class="form-label">開始</label>
          <input type="time" class="form-control" name="start_time" value="{{ ev.start_time|jtime if ev else '' }}">
        </div>
        <div class="col-6 col-sm-4 mb-3">
          <label class="form-label">終了</label>
          <input type="time" class="form-control" name="end_time" value="{{ ev.end_time|jtime if ev else '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">場所</label>
        <input type="text" class="form-control" name="place" value="{{ ev.place if ev and ev.place else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">対戦相手（試合のとき）</label>
        <input type="text" class="form-control" name="opponent" value="{{ ev.opponent if ev and ev.opponent else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">メモ</label>
        <textarea class="form-control" name="note" rows="3" placeholder="集合時間・持ち物など">{{ ev.note if ev and ev.note else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-success flex-grow-1">保存</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('events') }}">キャンセル</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
