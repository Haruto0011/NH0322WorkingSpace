{% extends "layout.html" %}
{% block content %}

<h1 class="h5 mb-3">プロフィール</h1>

<div class="card shadow-sm">
  <div class="card-body">
    <p class="text-muted small mb-3">{{ g.user.email }}{% if g.user.role == 'admin' %} ／ 管理者{% endif %}</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">名前 <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="uname" required value="{{ g.user.uname }}">
      </div>
      <div class="row">
        <div class="col-6 mb-3">
          <label class="form-label">背番号</label>
          <input type="number" class="form-control" name="number" min="0" max="99"
                 value="{{ g.user.number if g.user.number is not none else '' }}">
        </div>
        <div class="col-6 mb-3">
          <label class="form-label">ポジション</label>
          <select class="form-select" name="position">
            <option value="">–</option>
            {% for p in POSITIONS %}
            <option value="{{ p }}" {% if g.user.position == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <button class="btn btn-success w-100">保存</button>
    </form>
  </div>
</div>

{% endblock %}
