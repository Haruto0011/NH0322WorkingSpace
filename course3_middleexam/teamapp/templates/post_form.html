{% extends "layout.html" %}
{% block content %}

<a href="{{ url_for('posts') }}" class="text-decoration-none small">&larr; 投稿一覧</a>
<h1 class="h5 my-2">投稿する</h1>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">タイトル（任意）</label>
        <input type="text" class="form-control" name="title" maxlength="100" placeholder="例: 今週の練習について"
               value="{{ post.title if post and post.title else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">本文 <span class="text-danger">*</span></label>
        <textarea class="form-control" name="body" rows="6" required placeholder="チームへの連絡、お知らせ、試合の感想など">{{ post.body if post and post.body else '' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-team flex-grow-1">投稿</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('posts') }}">キャンセル</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
